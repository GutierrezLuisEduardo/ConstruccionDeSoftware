<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Formulario simple en HTML</title>
</head>
<body>
    <form method="POST" action="/form_method">
        <input type="number" name="indice" placeholder="Cantidad de veces a imprimir">
        </br>
        <input type="text" name="imprimir" placeholder="Valor a imprimir">
        </br>
        <input type="submit" placeholder="Enviar (imprimir en consola)">
    </form>
</body>
</html>
